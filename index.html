<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#8fd3ff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Sap City</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <!-- The 3D canvas goes here (full-bleed, under the notch too). -->
  <div id="app"></div>

  <!-- Overlay for on-screen UI (toolbar etc. in later tasks), inset by the safe areas. -->
  <div id="ui"></div>

  <div id="fallback" hidden>
    <p>Sap City needs a newer browser (with import maps and WebGL). Try the latest Safari, Chrome or Firefox.</p>
  </div>
  <noscript><div id="noscript">Sap City needs JavaScript.</div></noscript>

  <script>
    // Only load the game where import maps work; otherwise show the message above.
    if (window.HTMLScriptElement && HTMLScriptElement.supports && HTMLScriptElement.supports('importmap')) {
      var s = document.createElement('script');
      s.type = 'module';
      s.src = 'src/main.js';
      document.body.appendChild(s);
    } else {
      document.getElementById('fallback').hidden = false;
    }
  </script>
</body>
</html>
